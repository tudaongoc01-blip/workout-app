<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Workout Logbook - UL Plan</title>
    
    <!-- Khai báo Icon chuẩn icon.jpg -->
    <link rel="icon" type="image/jpeg" href="icon.jpg?v=9">
    <link rel="apple-touch-icon" href="icon.jpg?v=9">
    <link rel="manifest" href="manifest.json">

    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent: #ff9800;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --success: #4caf50;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            overflow-x: hidden;
            width: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 12px;
            padding-bottom: 80px;
        }

        h1 {
            text-align: center;
            font-size: 1.3rem;
            color: var(--accent);
            margin-top: 8px;
            margin-bottom: 14px;
        }

        .day-selector {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 14px;
            -webkit-overflow-scrolling: touch;
        }

        .day-selector::-webkit-scrollbar {
            display: none;
        }

        .day-btn {
            background: var(--card-bg);
            border: 1px solid #333;
            color: var(--text-secondary);
            padding: 8px 12px;
            border-radius: 10px;
            white-space: nowrap;
            cursor: pointer;
            text-align: center;
            min-width: 80px;
            flex-shrink: 0;
        }

        .day-btn.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
            font-weight: bold;
        }

        .day-btn .day-title {
            font-size: 0.75rem;
            display: block;
        }

        .day-btn .day-date {
            font-size: 0.9rem;
            font-weight: bold;
        }

        .exercise-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 14px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            width: 100%;
        }

        .exercise-title {
            font-size: 1rem;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 4px;
            word-break: break-word;
        }

        .exercise-meta {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }

        .exercise-img-container {
            width: 100%;
            background: #000000;
            border-radius: 8px;
            margin-bottom: 12px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 160px;
            border: 1px solid #333;
        }

        .exercise-img {
            width: 100%;
            max-height: 230px;
            object-fit: contain;
            display: block;
            background-color: #000;
        }

        .set-row {
            display: flex;
            gap: 6px;
            align-items: center;
            margin-bottom: 8px;
            width: 100%;
        }

        .set-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            width: 45px;
            flex-shrink: 0;
        }

        input[type="number"] {
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            padding: 8px 4px;
            border-radius: 6px;
            text-align: center;
            font-size: 0.85rem;
            flex: 1;
            min-width: 0;
            -webkit-appearance: none;
        }

        .check-btn {
            background: #333;
            border: none;
            color: #fff;
            height: 34px;
            width: 36px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .check-btn.done {
            background: var(--success);
        }

        .notes-box {
            background: #1a2733;
            border-left: 4px solid #2196f3;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            color: #e0e0e0;
            margin-top: 16px;
        }

        .rest-day {
            text-align: center;
            padding: 40px 16px;
            background: var(--card-bg);
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <h1>Logbook Tập Luyện UL</h1>

    <div class="day-selector" id="daySelector"></div>
    <div id="workoutContainer"></div>

    <div class="notes-box">
        <strong>Lưu ý giáo trình:</strong>
        <ul style="padding-left: 18px; margin: 6px 0 0 0;">
            <li>Thời gian nghỉ: Hiệp nặng 5 reps (nghỉ tới khi đủ phục hồi); Hiệp 8-12 reps (nghỉ 1-2 phút).</li>
            <li>Luôn chọn mức tạ nặng nhất có thể để đạt số reps chỉ định.</li>
            <li>Các hiệp warm-up nhẹ không tính vào Working Sets.</li>
        </ul>
    </div>

    <script>
        // Đường dẫn file GIF nội bộ đã tải lên thư mục 'gifs' trên GitHub
        const LOCAL_GIFS = {
            "BB Bench Press": "gifs/bench_press.gif",
            "Incline DB Bench Press (Neutral Grip)": "gifs/incline_db.gif",
            "Incline BB Bench Press": "gifs/incline_bb.gif",
            "Butterfly (hoặc DB Flys)": "gifs/flys.gif",
            "Pendlay Row (hoặc Seated Cable Row)": "gifs/pendlay_row.gif",
            "Rowing with DB": "gifs/db_row.gif",
            "Pull Up (hoặc Lat Pull Down)": "gifs/pullup.gif",
            "Pull Up": "gifs/pullup.gif",
            "OHP (Military Press)": "gifs/ohp.gif",
            "Bent Over Lateral Raise": "gifs/lateral_raise.gif",
            "Barbell Curl": "gifs/barbell_curl.gif",
            "DB Curl": "gifs/db_curl.gif",
            "Close Grip Bench Press (hoặc Dips)": "gifs/close_bench.gif",
            "Skull Crusher": "gifs/skull_crusher.gif",
            "DB Shrug": "gifs/shrug.gif",
            "Squat": "gifs/squat.gif",
            "Leg Press": "gifs/leg_press.gif",
            "Sumo Deadlift (hoặc Conventional DL)": "gifs/sumo_dl.gif",
            "Sumo Deadlift": "gifs/sumo_dl.gif",
            "Stiff Leg Deadlift (hoặc DB RDL)": "gifs/stiff_dl.gif",
            "Stiff Leg Deadlift": "gifs/stiff_dl.gif",
            "Lunges": "gifs/lunges.gif",
            "Standing Calf Raise": "gifs/calf_raise.gif",
            "Abs 1 (Hanging / Lying Leg Raise)": "gifs/leg_raise.gif",
            "Abs 1 (Leg Raises)": "gifs/leg_raise.gif",
            "Abs 2 (Machine / Floor Crunches)": "gifs/crunches.gif",
            "Abs 2 (Crunches)": "gifs/crunches.gif"
        };

        const cycleProgram = [
            {
                dayName: "Thứ 2 - Day 1",
                title: "Upper Body (Heavy)",
                type: "workout",
                exercises: [
                    { name: "BB Bench Press", sets: 3, reps: "8-10" },
                    { name: "Incline DB Bench Press (Neutral Grip)", sets: 3, reps: "6-8" },
                    { name: "Pendlay Row (hoặc Seated Cable Row)", sets: 4, reps: "6-8" },
                    { name: "Pull Up (hoặc Lat Pull Down)", sets: 3, reps: "6-8" },
                    { name: "OHP (Military Press)", sets: 3, reps: "8-10" },
                    { name: "Barbell Curl", sets: 3, reps: "6-8" },
                    { name: "Close Grip Bench Press (hoặc Dips)", sets: 3, reps: "6-8" },
                    { name: "DB Shrug", sets: 3, reps: "6-8" }
                ]
            },
            {
                dayName: "Thứ 3 - Day 2",
                title: "Lower Body (Heavy)",
                type: "workout",
                exercises: [
                    { name: "Squat", sets: 5, reps: "6" },
                    { name: "Leg Press", sets: 5, reps: "6" },
                    { name: "Sumo Deadlift (hoặc Conventional DL)", sets: 5, reps: "5" },
                    { name: "Stiff Leg Deadlift (hoặc DB RDL)", sets: 3, reps: "6-8" },
                    { name: "Lunges", sets: 3, reps: "6-8" },
                    { name: "Standing Calf Raise", sets: 4, reps: "15-20" },
                    { name: "Abs 1 (Hanging / Lying Leg Raise)", sets: 4, reps: "8-12" },
                    { name: "Abs 2 (Machine / Floor Crunches)", sets: 4, reps: "8-12" }
                ]
            },
            {
                dayName: "Thứ 4 - Day 3",
                title: "Rest Day",
                type: "rest",
                message: "Ngày nghỉ phục hồi hoàn toàn. Ăn uống đầy đủ đạm và ngủ đủ giấc!"
            },
            {
                dayName: "Thứ 5 - Day 4",
                title: "Upper Body (Hypertrophy)",
                type: "workout",
                exercises: [
                    { name: "Incline BB Bench Press", sets: 3, reps: "8-12" },
                    { name: "Butterfly (hoặc DB Flys)", sets: 3, reps: "12" },
                    { name: "Pull Up", sets: 3, reps: "8-12" },
                    { name: "Rowing with DB", sets: 3, reps: "8-12" },
                    { name: "OHP (Military Press)", sets: 3, reps: "6-8" },
                    { name: "Bent Over Lateral Raise", sets: 3, reps: "8-12" },
                    { name: "DB Curl", sets: 3, reps: "8-12" },
                    { name: "Skull Crusher", sets: 3, reps: "8-12" }
                ]
            },
            {
                dayName: "Thứ 6 - Day 5",
                title: "Lower Body (Hypertrophy)",
                type: "workout",
                exercises: [
                    { name: "Squat", sets: 4, reps: "6-10" },
                    { name: "Leg Press", sets: 4, reps: "8-10" },
                    { name: "Sumo Deadlift", sets: 3, reps: "6-10" },
                    { name: "Stiff Leg Deadlift", sets: 3, reps: "8-12" },
                    { name: "Lunges", sets: 3, reps: "8-12" },
                    { name: "Standing Calf Raise", sets: 5, reps: "15-20" },
                    { name: "Abs 1 (Leg Raises)", sets: 4, reps: "8-12" },
                    { name: "Abs 2 (Crunches)", sets: 4, reps: "8-12" }
                ]
            },
            {
                dayName: "Thứ 7 - Day 6",
                title: "Rest Day",
                type: "rest",
                message: "Ngày nghỉ phục hồi cơ bắp!"
            },
            {
                dayName: "Chủ Nhật - Day 7",
                title: "Rest or Cardio 30M",
                type: "rest",
                message: "Nghỉ ngơi hoặc tập LISS Cardio nhẹ nhàng 30 phút (chạy bộ, đi bộ, đạp xe...)."
            }
        ];

        const START_DATE = new Date(2026, 9, 19); 
        const TOTAL_DAYS = 84;

        let calendarList = [];
        let selectedDateStr = "";

        function formatDateKey(dateObj) {
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const d = String(dateObj.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function generateCalendar() {
            calendarList = [];
            for (let i = 0; i < TOTAL_DAYS; i++) {
                const currentDate = new Date(START_DATE.getFullYear(), START_DATE.getMonth(), START_DATE.getDate() + i);

                const dateKey = formatDateKey(currentDate);
                const cycleIndex = i % 7;
                const programData = cycleProgram[cycleIndex];

                const dayOfWeekNames = ["Chủ Nhật", "Thứ 2", "Thứ 3", "Thứ 4", "Thứ 5", "Thứ 6", "Thứ 7"];
                const dayLabel = `${dayOfWeekNames[currentDate.getDay()]}, ${currentDate.getDate()}/${currentDate.getMonth() + 1}/${currentDate.getFullYear()}`;

                const weekNum = Math.floor(i / 7) + 1;

                calendarList.push({
                    dateKey: dateKey,
                    displayLabel: `${dayLabel} (Tuần ${weekNum})`,
                    shortDate: `${currentDate.getDate()}/${currentDate.getMonth() + 1}`,
                    shortDay: dayOfWeekNames[currentDate.getDay()],
                    program: programData
                });
            }

            const todayKey = formatDateKey(new Date());
            const hasToday = calendarList.find(item => item.dateKey === todayKey);
            selectedDateStr = hasToday ? todayKey : calendarList[0].dateKey;
        }

        function initApp() {
            generateCalendar();
            renderDaySelector();
            renderWorkout(selectedDateStr);
        }

        function renderDaySelector() {
            const container = document.getElementById("daySelector");
            if (!container) return;
            container.innerHTML = "";

            calendarList.forEach(item => {
                const btn = document.createElement("button");
                btn.className = `day-btn ${item.dateKey === selectedDateStr ? 'active' : ''}`;
                btn.id = `btn_${item.dateKey}`;
                btn.innerHTML = `
                    <span class="day-title">${item.shortDay}</span>
                    <span class="day-date">${item.shortDate}</span>
                `;
                btn.onclick = () => {
                    selectedDateStr = item.dateKey;
                    renderDaySelector();
                    renderWorkout(selectedDateStr);
                    scrollToActiveBtn();
                };
                container.appendChild(btn);
            });
        }

        function scrollToActiveBtn() {
            const activeBtn = document.getElementById(`btn_${selectedDateStr}`);
            if (activeBtn) {
                activeBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            }
        }

        function hideImgContainer(imgElement) {
            if (imgElement && imgElement.parentNode) {
                imgElement.parentNode.style.display = 'none';
            }
        }

        function renderWorkout(dateKey) {
            const container = document.getElementById("workoutContainer");
            if (!container) return;
            container.innerHTML = "";

            const dayInfo = calendarList.find(item => item.dateKey === dateKey);
            if (!dayInfo) return;

            const program = dayInfo.program;

            if (program.type === "rest") {
                container.innerHTML = `
                    <div class="rest-day">
                        <h2 style="font-size: 1.1rem; margin-top: 0;">${dayInfo.displayLabel}</h2>
                        <h3 style="color: var(--accent); font-size: 1rem;">${program.title}</h3>
                        <p style="font-size: 0.9rem;">${program.message}</p>
                    </div>
                `;
                return;
            }

            const headerHTML = `
                <div style="margin-bottom: 12px;">
                    <h2 style="margin: 0; font-size: 1.1rem;">${dayInfo.displayLabel}</h2>
                    <div style="color: var(--accent); font-weight: bold; font-size: 0.95rem;">${program.title}</div>
                </div>
            `;
            container.innerHTML = headerHTML;

            program.exercises.forEach((ex, exIdx) => {
                const card = document.createElement("div");
                card.className = "exercise-card";

                const gifPath = LOCAL_GIFS[ex.name];
                // Tự động ẩn khung chứa nếu chưa upload file GIF đó để không vỡ giao diện
                const imgHTML = gifPath ? `
                    <div class="exercise-img-container">
                        <img class="exercise-img" src="${gifPath}" alt="${ex.name}" loading="lazy" onerror="hideImgContainer(this)">
                    </div>
                ` : '';

                let setsHTML = "";
                for (let s = 1; s <= ex.sets; s++) {
                    const savedData = getSavedSetData(dateKey, exIdx, s);
                    setsHTML += `
                        <div class="set-row">
                            <span class="set-label">Hiệp ${s}</span>
                            <input type="number" id="weight_${dateKey}_${exIdx}_${s}" placeholder="kg" value="${savedData.weight || ''}">
                            <input type="number" id="reps_${dateKey}_${exIdx}_${s}" placeholder="reps" value="${savedData.reps || ''}">
                            <button class="check-btn ${savedData.done ? 'done' : ''}" onclick="toggleCheck('${dateKey}', ${exIdx}, ${s})">
                                ✓
                            </button>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="exercise-title">${ex.name}</div>
                    <div class="exercise-meta">${ex.sets} Hiệp chính × Target: ${ex.reps} reps</div>
                    ${imgHTML}
                    ${setsHTML}
                `;
                container.appendChild(card);
            });
        }

        function getSavedSetData(dateKey, exIdx, setNum) {
            try {
                const key = `workout_${dateKey}_${exIdx}_${setNum}`;
                const data = localStorage.getItem(key);
                return data ? JSON.parse(data) : { weight: "", reps: "", done: false };
            } catch (e) {
                return { weight: "", reps: "", done: false };
            }
        }

        function toggleCheck(dateKey, exIdx, setNum) {
            const weightVal = document.getElementById(`weight_${dateKey}_${exIdx}_${setNum}`).value;
            const repsVal = document.getElementById(`reps_${dateKey}_${exIdx}_${setNum}`).value;
            const btn = event.currentTarget;

            const isDone = !btn.classList.contains("done");
            if (isDone) {
                btn.classList.add("done");
            } else {
                btn.classList.remove("done");
            }

            const key = `workout_${dateKey}_${exIdx}_${setNum}`;
            localStorage.setItem(key, JSON.stringify({
                weight: weightVal,
                reps: repsVal,
                done: isDone
            }));
        }

        document.addEventListener("DOMContentLoaded", initApp);
    </script>
</body>
</html>
