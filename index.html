<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Workout Logbook - UL Plan</title>
    
    <link rel="icon" type="image/jpeg" href="icon.jpg?v=16">
    <link rel="apple-touch-icon" href="icon.jpg?v=16">
    <link rel="manifest" href="manifest.json">

    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent: #ff9800;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --success: #4caf50;
        }

        * { box-sizing: border-box; }
        html, body { overflow-x: hidden; width: 100%; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 12px;
            padding-bottom: 90px;
        }

        h1 {
            text-align: center;
            font-size: 1.3rem;
            color: var(--accent);
            margin-top: 8px;
            margin-bottom: 14px;
        }

        .day-selector {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 14px;
            -webkit-overflow-scrolling: touch;
        }
        .day-selector::-webkit-scrollbar { display: none; }

        .day-btn {
            background: var(--card-bg);
            border: 1px solid #333;
            color: var(--text-secondary);
            padding: 8px 12px;
            border-radius: 10px;
            white-space: nowrap;
            cursor: pointer;
            text-align: center;
            min-width: 80px;
            flex-shrink: 0;
        }
        .day-btn.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
            font-weight: bold;
        }
        .day-btn .day-title { font-size: 0.75rem; display: block; }
        .day-btn .day-date { font-size: 0.9rem; font-weight: bold; }

        .exercise-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 14px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            width: 100%;
        }
        .exercise-title {
            font-size: 1rem;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 4px;
            word-break: break-word;
        }
        .exercise-meta {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }

        .exercise-img-container {
            width: 100%;
            background: #000000;
            border-radius: 8px;
            margin-bottom: 12px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 160px;
            border: 1px solid #333;
        }
        .exercise-img {
            width: 100%;
            max-height: 230px;
            object-fit: contain;
            display: block;
            background-color: #000;
        }

        .set-row {
            display: flex;
            gap: 6px;
            align-items: center;
            margin-bottom: 8px;
            width: 100%;
        }
        .set-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            width: 45px;
            flex-shrink: 0;
        }
        input[type="number"] {
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            padding: 8px 4px;
            border-radius: 6px;
            text-align: center;
            font-size: 0.85rem;
            flex: 1;
            min-width: 0;
            -webkit-appearance: none;
        }
        .check-btn {
            background: #333;
            border: none;
            color: #fff;
            height: 34px;
            width: 36px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            flex-shrink: 0;
        }
        .check-btn.done { background: var(--success); }

        .notes-box {
            background: #1a2733;
            border-left: 4px solid #2196f3;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            color: #e0e0e0;
            margin-top: 16px;
        }
        .rest-day {
            text-align: center;
            padding: 40px 16px;
            background: var(--card-bg);
            border-radius: 12px;
        }

        /* NÚT BẬT CHATBOT CỐ ĐỊNH Ở ĐÁY MÀN HÌNH */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: #1a1a1a;
            border-top: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: space-around;
            z-index: 9999;
            padding: 0 16px;
        }

        .ai-chat-trigger-btn {
            background: linear-gradient(135deg, #ff9800, #f57c00);
            border: none;
            color: #000;
            font-weight: bold;
            font-size: 0.9rem;
            padding: 10px 20px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 152, 0, 0.3);
            width: 100%;
            justify-content: center;
        }

        /* CỬA SỔ CHAT */
        .chat-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 100000;
            align-items: flex-end;
            justify-content: center;
        }
        .chat-modal.open { display: flex; }

        .chat-container {
            width: 100%;
            max-width: 500px;
            height: 85vh;
            background: #1e1e1e;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
        }

        .chat-header {
            padding: 12px 16px;
            background: #282828;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }
        .chat-header h3 { margin: 0; font-size: 1rem; color: var(--accent); }
        .chat-close { background: none; border: none; color: #fff; font-size: 1.4rem; cursor: pointer; padding: 0 8px; }

        .chat-body {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .msg {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.88rem;
            line-height: 1.4;
            word-break: break-word;
        }
        .msg.user {
            align-self: flex-end;
            background: var(--accent);
            color: #000;
            border-bottom-right-radius: 2px;
            font-weight: 500;
        }
        .msg.ai {
            align-self: flex-start;
            background: #2a2a2a;
            color: #fff;
            border-bottom-left-radius: 2px;
            border: 1px solid #333;
        }

        .chat-input-area {
            padding: 10px 12px;
            background: #282828;
            display: flex;
            gap: 8px;
            border-top: 1px solid #333;
        }
        .chat-input {
            flex: 1;
            background: #121212;
            border: 1px solid #444;
            color: #fff;
            padding: 10px 14px;
            border-radius: 20px;
            font-size: 0.88rem;
            outline: none;
        }
        .send-btn {
            background: var(--accent);
            border: none;
            color: #000;
            padding: 0 16px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Logbook Tập Luyện UL</h1>

    <div class="day-selector" id
