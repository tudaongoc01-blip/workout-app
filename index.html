<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Workout Logbook - UL Plan</title>
    
    <!-- Khai báo Icon -->
    <link rel="icon" type="image/jpeg" href="images.jpg">
    <link rel="apple-touch-icon" href="images.jpg">
    <link rel="manifest" href="manifest.json">

    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent: #ff9800;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --success: #4caf50;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            overflow-x: hidden;
            width: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 12px;
            padding-bottom: 80px;
        }

        h1 {
            text-align: center;
            font-size: 1.3rem;
            color: var(--accent);
            margin-top: 8px;
            margin-bottom: 14px;
        }

        .day-selector {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 14px;
            -webkit-overflow-scrolling: touch;
        }

        .day-selector::-webkit-scrollbar {
            display: none;
        }

        .day-btn {
            background: var(--card-bg);
            border: 1px solid #333;
            color: var(--text-secondary);
            padding: 8px 12px;
            border-radius: 10px;
            white-space: nowrap;
            cursor: pointer;
            text-align: center;
            min-width: 80px;
            flex-shrink: 0;
        }

        .day-btn.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
            font-weight: bold;
        }

        .day-btn .day-title {
            font-size: 0.75rem;
            display: block;
        }

        .day-btn .day-date {
            font-size: 0.9rem;
            font-weight: bold;
        }

        .exercise-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 14px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            width: 100%;
        }

        .exercise-title {
            font-size: 1rem;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 4px;
            word-break: break-word;
        }

        .exercise-meta {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }

        /* Khung chứa GIF động */
        .exercise-img-container {
            width: 100%;
            background: #000000;
            border-radius: 8px;
            margin-bottom: 12px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 180px;
            border: 1px solid #333;
        }

        .exercise-img {
            width: 100%;
            max-height: 250px;
            object-fit: contain;
            display: block;
            border-radius: 8px;
            background-color: #000;
        }

        .set-row {
            display: flex;
            gap: 6px;
            align-items: center;
            margin-bottom: 8px;
            width: 100%;
        }

        .set-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            width: 45px;
            flex-shrink: 0;
        }

        input[type="number"] {
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            padding: 8px 4px;
            border-radius: 6px;
            text-align: center;
            font-size: 0.85rem;
            flex: 1;
            min-width: 0;
            -webkit-appearance: none;
        }

        .check-btn {
            background: #333;
            border: none;
            color: #fff;
            height: 34px;
            width: 36px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .check-btn.done {
            background: var(--success);
        }

        .notes-box {
            background: #1a2733;
            border-left: 4px solid #2196f3;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            color: #e0e0e0;
            margin-top: 16px;
        }

        .rest-day {
            text-align: center;
            padding: 40px 16px;
            background: var(--card-bg);
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <div class="day
